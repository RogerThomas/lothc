# https://taskfile.dev
version: '3'

vars:
  PYTEST_PROFILE: '{{default "dev" .PYTEST_PROFILE}}'
  PYTEST_ARGS_DEV: -s -vv -rA --tb=short --color=yes
  PYTEST_ARGS_AGENT: -x -q --tb=short --no-header --disable-warnings --color=no -p no:cacheprovider
  PYTEST_ARGS: '{{if eq .PYTEST_PROFILE "agent"}}{{.PYTEST_ARGS_AGENT}}{{else}}{{.PYTEST_ARGS_DEV}}{{end}}'
  PYTEST_RUN: uv run pytest {{.PYTEST_ARGS}}
  PERF_CPUSET: '{{default "2" .PERF_CPUSET}}'
  JSON_SERVER_CPUSET: '{{default "0,1" .JSON_SERVER_CPUSET}}'

tasks:
  default:
    silent: true
    aliases: [help]
    desc: "Print help"
    cmd: task --list

  # ------------------------------------------------------------------------------------------------
  # - Dependencies -----------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------
  deps-sync:
    desc: Install dependencies
    cmd: uv sync --all-extras --all-groups

  deps-upgrade:
    desc: Update dependencies
    cmd: uv sync --all-extras --all-groups --upgrade

  deps-lock:
    desc: Lock dependencies
    cmd: uv lock

  # ------------------------------------------------------------------------------------------------
  # - Test ---------------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------
  test:
    desc: Run the test suite
    cmd: '{{.PYTEST_RUN}} tests {{.CLI_ARGS}}'

  test-doctests:
    desc: Run doctests
    cmd: '{{.PYTEST_RUN}} --doctest-modules lothc {{.CLI_ARGS}}'

  test-one:
    desc: Run a single test in isolation
    cmd: '{{.PYTEST_RUN}} {{.CLI_ARGS}}'

  # ------------------------------------------------------------------------------------------------
  # - Lint / format / typecheck ----------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------
  lint:
    desc: Lint and auto-fix
    cmd: uv run ruff check --fix {{.CLI_ARGS | default "."}}

  format:
    desc: Format code
    cmd: uv run ruff format {{.CLI_ARGS | default "."}}

  typecheck:
    desc: Type-check with basedpyright
    cmd: uv run basedpyright {{.CLI_ARGS | default "."}}

  check:
    desc: Lint, format-check, and typecheck (what CI runs)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run basedpyright .

  precommit-install:
    desc: Install the git pre-commit hook
    cmd: uv run prek install

  precommit:
    desc: Run all pre-commit hooks against the whole repo
    cmd: uv run prek run --all-files

  # ------------------------------------------------------------------------------------------------
  # - Examples -----------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------
  example-server:
    desc: Run the stdlib-only example test server on port 8701
    cmd: uv run yeet ./examples/server.py

  example-run:
    desc: Run the example showcase script against example-server
    cmd: uv run yeet ./examples/run_http.py {{.CLI_ARGS}}

  # ------------------------------------------------------------------------------------------------
  # - Docs ---------------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------
  docs:
    desc: Serve the docs site locally on port 9223 with live reload
    cmds:
      - defer: lsof -ti:9223 | xargs -r kill -9
      - lsof -ti:9223 | xargs -r kill -9
      - uv run zensical serve --dev-addr localhost:9223

  docs-build:
    desc: Build the static docs site into site/
    cmd: uv run zensical build

  # ------------------------------------------------------------------------------------------------
  # - Benchmarks ---------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------------------
  perf-build:
    desc: Build the json-server and perf benchmark images (docker compose)
    dir: benchmarks
    cmd: docker compose build

  perf:
    desc: >
      Run perf.py against a separate json-server container, so the server never
      competes with the client under test for CPU. json-server gets
      JSON_SERVER_CPUSET cores (default "0,1"), perf gets PERF_CPUSET (default
      "2") — e.g. JSON_SERVER_CPUSET=0,1 PERF_CPUSET=2 task perf -- --total-requests 5000.
      Each run's JSON results land in ./results/<run_id>.json on the host.
    dir: benchmarks
    env:
      JSON_SERVER_CPUSET: "{{.JSON_SERVER_CPUSET}}"
      PERF_CPUSET: "{{.PERF_CPUSET}}"
    cmds:
      - mkdir -p ../results
      - defer: docker compose down
      - docker compose run --rm perf {{.CLI_ARGS}}

  perf-svg:
    desc: >
      Regenerate assets/perf-race.svg from a perf.py results file. Usage:
      task perf-svg -- results/<run_id>.json [--race-seconds N].
    cmd: uv run yeet benchmarks/race_svg.py {{.CLI_ARGS}}

  # asv (airspeed velocity) tracks lothc's OWN performance across its git history — a
  # different job than perf.py above, which compares lothc against other HTTP client
  # libraries at a single point in time. See asv_bench/bench_download.py and CLAUDE.md.
  asv-quick:
    desc: >
      Fast dev-loop check that the asv_bench/ benchmarks actually run, against the
      current checkout — no isolated env build, no history, results not saved.
    cmd: uv run asv run --quick --dry-run -E existing {{.CLI_ARGS}}

  asv-run:
    desc: >
      Run asv_bench/ benchmarks across real commit history in an isolated env per
      commit. Usage: task asv-run -- <commit-range> (e.g. main~5..main), or with no
      args benchmarks just the tip of each configured branch (no history).
    cmd: uv run asv run {{.CLI_ARGS}}

  asv-continuous:
    desc: >
      "I made a small change and committed it — did it regress anything?" Builds
      and benchmarks two commits side by side and prints a before/after table with
      significant changes flagged. Defaults to HEAD vs its parent. Usage:
      task asv-continuous [-- <base> <branch>], e.g. task asv-continuous -- main~5 main.
      Drop-in --quick is fine to sanity-check the mechanism but too noisy (one
      sample) to trust as a real answer — omit it for the real repeat=3 sampling.
    cmd: uv run asv continuous {{.CLI_ARGS | default "HEAD^ HEAD"}}

  asv-publish:
    desc: Collate .asv/results/ into a static HTML dashboard at .asv/html/
    cmd: uv run asv publish

  asv-preview:
    desc: Serve the asv-publish dashboard locally so you can see the trend graphs
    cmd: uv run asv preview
