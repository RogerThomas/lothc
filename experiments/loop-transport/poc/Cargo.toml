[package]
name = "lothc-poc"
version = "0.1.0"
edition = "2021"

[lib]
name = "_poc"
crate-type = ["cdylib"]

# Same pins as pyreqwest 0.15.0 where it has them.
[dependencies]
pyo3 = { version = "=0.29.3", features = ["extension-module"] }
hyper = { version = "=1.12.0", features = ["client", "http1"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
futures-executor = "=0.3.34"
futures-util = "=0.3.34"
libc = "0.2"
form_urlencoded = "1"
ryu = "1"
itoa = "1"
# TLS as reqwest 0.13's `rustls` feature: aws-lc-rs + the OS trust store.
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
rustls-pki-types = "=1.15.1"

[profile.release]
lto = "fat"
codegen-units = 1
