coverage:
  range: 85..100
  round: down
  precision: 1
  status:
    project:
      default:
        # `target: auto` compares against the base commit's own coverage rather than a fixed
        # number — real coverage is ~97% (fixed measurement bug, see ci.yml), so a PR only fails
        # if it actually regresses coverage beyond the threshold below.
        target: auto
        threshold: 0.5%
