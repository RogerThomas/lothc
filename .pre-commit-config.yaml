repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright .
        language: system
        files: \.py$
        pass_filenames: false

      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        files: \.py$
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: uv run vulture --min-confidence 100 lothc tests examples benchmarks perf.py vulture_whitelist.py
        language: system
        files: \.py$
        pass_filenames: false

      - id: pylint
        name: pylint
        entry: uv run pylint lothc
        language: system
        files: \.py$
        pass_filenames: false
