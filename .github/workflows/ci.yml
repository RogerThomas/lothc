name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright .
      # `coverage run` (process-level), not `pytest --cov` — the latter starts tracing after
      # pytest's own plugins (incl. lothc.testing, an auto-loaded pytest11 plugin) already
      # imported, so their module-level code always showed as uncovered. Real coverage was 97%,
      # not ~79%.
      - run: uv run coverage run --rcfile=pyproject.toml -m pytest tests
      - run: uv run coverage xml
      # Uploaded from every matrix version so Codecov merges them into one accurate report,
      # rather than the last-finishing job's coverage silently overwriting the others'.
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
