name: CI
on:
  push:
    branches:
      - main
  pull_request:
  # Lets release.yml run this whole workflow as a gate before it publishes to PyPI, so a release
  # can't ship a commit whose tests never ran (or failed).
  workflow_call:
env:
  # Every job that runs the suite on the native transport (LOTHC_TRANSPORT=native, as
  # `task test-native` does) leaves out these: the tests that need `http2=True`, which native
  # refuses with NotImplementedError until HTTP/2 is ported (CLAUDE.md).
  NATIVE_DESELECT: >-
    --deselect tests/test_client_build.py::test_http2_falls_back_to_http1_against_an_http1_only_server
    --deselect tests/test_client_build.py::test_sync_http2_falls_back_to_http1_against_an_http1_only_server
    --deselect tests/test_tls.py::test_http2_over_tls_falls_back_to_http1_via_alpn
    --deselect tests/test_tls.py::test_sync_http2_over_tls_falls_back_to_http1_via_alpn
    --deselect tests/test_http2.py::test_http2_true_negotiates_http2_with_a_server_that_offers_it
    --deselect tests/test_http2.py::test_sync_http2_true_negotiates_http2_with_a_server_that_offers_it
    --deselect tests/test_http2.py::test_http2_carries_several_requests_on_one_client
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      # The extension's dependencies, built once per job and Python version.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
          key: ${{ matrix.python-version }}
      - run: uv sync --all-extras --group dev --group perf
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright .
      # tests/ exercises lothc's public API the way a consumer would, so it must type-check under
      # every major checker, not only basedpyright (see CLAUDE.md, "Type-checking tests/ across
      # all 4 major type checkers"). Until these ran here, that rule was only kept by habit.
      - run: uv run mypy tests
      - run: uv run ty check tests
      - run: uv run zuban check tests
      - run: uv run pytest --doctest-modules lothc
      # `coverage run` (process-level), not `pytest --cov` — the latter starts tracing after
      # pytest's own plugins (incl. lothc.testing, an auto-loaded pytest11 plugin) already
      # imported, so their module-level code always showed as uncovered. Real coverage was 97%,
      # not ~79%.
      - run: uv run coverage run --rcfile=pyproject.toml -m pytest tests
      # The suite again on the native transport, appended to the same coverage data.
      - run: uv run coverage run --rcfile=pyproject.toml --append -m pytest tests $NATIVE_DESELECT
        env:
          LOTHC_TRANSPORT: native
      - run: uv run coverage xml
      # Uploaded from every matrix version so Codecov merges them into one accurate report,
      # rather than the last-finishing job's coverage silently overwriting the others'.
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The whole suite with the GIL actually off, since lothc shares process-wide state across
  # threads (the decoder cache, the `raises=` cache, lazy `Response.headers`' first read) and
  # users share one client across threads and event loops. Tests only: lint and type-checking
  # don't depend on the GIL, and the jobs above already run them. --no-default-groups leaves out
  # the `perf` group (perf.py's comparison clients), whose qh3 has no free-threaded 3.15 wheel,
  # and --no-sync keeps `uv run` from syncing it back in. PYTHON_GIL=0 keeps the GIL off even if
  # an extension module doesn't declare free-threading support (CPython would re-enable it).
  test-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    runs-on: ubuntu-latest
    env:
      PYTHON_GIL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      # The extension's dependencies, built once per job and Python version.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
          key: ${{ matrix.python-version }}
      - run: uv sync --all-extras --no-default-groups --group dev
      - run: uv run --no-sync python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is on'"
      - run: uv run --no-sync pytest tests
      # The native transport shares its pools' state across threads, so a data race in it shows
      # here.
      - run: uv run --no-sync pytest tests $NATIVE_DESELECT
        env:
          LOTHC_TRANSPORT: native

  # The suite on each other platform lothc will ship wheels for, one Python version each. Tests
  # only: lint and type-checking don't vary by platform, and the `test` jobs run them. Windows
  # runs the pyreqwest transport only, since native is POSIX only (CLAUDE.md) and
  # `lothc._native` is a stub there. --no-default-groups leaves out the `perf` group, as above.
  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Arm; macos-26-intel is GitHub's current Intel macOS runner.
        os: [ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
      - run: uv sync --all-extras --no-default-groups --group dev
      - if: runner.os == 'macOS'
        run: uv run --no-sync python experiments/ci_diag.py
      - run: uv run --no-sync pytest tests
      # Even after a failure on pyreqwest, so each transport's result shows.
      - if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: uv run --no-sync pytest tests $NATIVE_DESELECT
        env:
          LOTHC_TRANSPORT: native

  # pydantic and msgspec are optional extras, but the `test` job above always has both installed,
  # so a stray unguarded import of either would pass CI and then crash `import lothc` for anyone
  # who installed plain `lothc`. tests/test_compat_fallbacks.py only simulates the missing
  # packages; this job genuinely leaves them out.
  test-no-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
      # The locked dev group minus the two extras, rather than a hand-picked `pytest ...` list,
      # so a new test-only dependency (e.g. trustme) can't silently break this job.
      - run: >-
          uv sync --group dev
          --no-install-package pydantic --no-install-package pydantic-core
          --no-install-package msgspec
      # `--no-sync` from here on: a plain `uv run` would re-sync and put the extras back.
      # Asserting they're absent guards against another dependency pulling one in transitively.
      - run: >-
          uv run --no-sync python -c "import importlib.util as u;
          present = [m for m in ('pydantic', 'msgspec') if u.find_spec(m)];
          assert not present, present; import lothc, lothc.testing"
      # Every test module that never mentions either library, picked at run time so a new
      # module is covered without editing this list.
      - run: uv run --no-sync pytest $(grep -LE 'pydantic|msgspec' tests/test_*.py)
