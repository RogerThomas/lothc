name: Release

on:
  release:
    types: [published]

jobs:
  # The full CI workflow (lint, all four type checkers, tests with and without the optional
  # extras) against the exact tagged commit. Publishing used to go straight from `uv build` to
  # `uv publish`, so a release could ship a commit CI had never passed.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # ci.yml's Codecov upload reads CODECOV_TOKEN, which a called workflow doesn't get otherwise.
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no PyPI token/secret needed. The environment name here must
    # match the one configured as the trusted publisher on the PyPI project settings ("pypi").
    environment:
      name: pypi
      url: https://pypi.org/p/lothc
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags — needs full history to see them,
          # not just the single commit a shallow checkout would give it.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - run: uv build

      # Install the wheel just built, with no extras, into a clean env and import it: catches a
      # packaging mistake (a module left out of the wheel) that the tests, which run against the
      # source tree, can't see.
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import lothc"

      - run: uv publish

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - run: uv sync --group docs
      - run: uv run zensical build
      - run: uv run yeet ./scripts/build_agent_docs.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
