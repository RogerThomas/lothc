name: Release

# Dispatched by release-please.yml against the new tag once a release PR is merged. Run it by hand
# (`gh workflow run release.yml --ref <tag>`) to retry a failed publish.
on:
  workflow_dispatch:

jobs:
  # The full CI workflow (lint, all four type checkers, tests with and without the optional
  # extras) against the exact tagged commit. Publishing used to go straight from `uv build` to
  # `uv publish`, so a release could ship a commit CI had never passed.
  test:
    # Only ever publish a tag: the release-please commit that set pyproject.toml's version.
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # ci.yml's Codecov upload reads CODECOV_TOKEN, which a called workflow doesn't get otherwise.
    secrets: inherit

  # Every platform's wheels (PGO-optimised where the native transport runs) and the sdist, each
  # already installed into a clean environment on its own platform and smoke-tested there.
  wheels:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  publish:
    needs: [test, wheels]
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no PyPI token/secret needed. The environment name here must
    # match the one configured as the trusted publisher on the PyPI project settings ("pypi").
    environment:
      name: pypi
      url: https://pypi.org/p/lothc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v10.3.3

      - run: ls -l dist

      - run: uv publish

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - run: uv sync --group docs
      - run: uv run zensical build
      - run: uv run yeet ./scripts/build_agent_docs.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
