<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406">
  <title>pyreqwest throughput race against 6 other HTTP clients</title>
  <desc>7 HTTP client libraries race to the same finish line, scaled so
  the slowest (httpx) takes 5 seconds and every other
  library finishes in proportion to how much faster it actually was.
  pyreqwest finishes in about 0.10s.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 15px; fill: #0b0b0b; font-weight: 600; }
    .tick { font-size: 10px; fill: #898781; }
    .name { font-size: 13px; fill: #0b0b0b; font-weight: 600; }
    .rate { font-size: 10px; fill: #52514e; }
    .badge { font-size: 12px; font-weight: 700; }
    .track { fill: #f3f2ef; stroke: #e1e0d9; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .playhead { stroke: #0b0b0b; stroke-width: 1.5; opacity: 0.55; }

    /* One 8s loop: the race runs 0-62.500% (0-5s of
       "race time"), then every bar holds its final state for the remaining
       3s so the finish badges stay readable before it resets. */
    #playhead { animation: playhead 8s linear infinite; }
    #bar-pyreqwest { animation: fill-pyreqwest 8s linear infinite; }
    #badge-pyreqwest { animation: show-pyreqwest 8s step-end infinite; }
    @keyframes fill-pyreqwest { 0% { width: 0; } 1.210% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-pyreqwest { 0% { opacity: 0; } 1.210% { opacity: 1; } 100% { opacity: 1; } }
    #bar-lothc { animation: fill-lothc 8s linear infinite; }
    #badge-lothc { animation: show-lothc 8s step-end infinite; }
    @keyframes fill-lothc { 0% { width: 0; } 1.251% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-lothc { 0% { opacity: 0; } 1.251% { opacity: 1; } 100% { opacity: 1; } }
    #bar-aiohttp { animation: fill-aiohttp 8s linear infinite; }
    #badge-aiohttp { animation: show-aiohttp 8s step-end infinite; }
    @keyframes fill-aiohttp { 0% { width: 0; } 2.571% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-aiohttp { 0% { opacity: 0; } 2.571% { opacity: 1; } 100% { opacity: 1; } }
    #bar-aiosonic { animation: fill-aiosonic 8s linear infinite; }
    #badge-aiosonic { animation: show-aiosonic 8s step-end infinite; }
    @keyframes fill-aiosonic { 0% { width: 0; } 3.742% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-aiosonic { 0% { opacity: 0; } 3.742% { opacity: 1; } 100% { opacity: 1; } }
    #bar-niquests { animation: fill-niquests 8s linear infinite; }
    #badge-niquests { animation: show-niquests 8s step-end infinite; }
    @keyframes fill-niquests { 0% { width: 0; } 18.002% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-niquests { 0% { opacity: 0; } 18.002% { opacity: 1; } 100% { opacity: 1; } }
    #bar-httpx2 { animation: fill-httpx2 8s linear infinite; }
    #badge-httpx2 { animation: show-httpx2 8s step-end infinite; }
    @keyframes fill-httpx2 { 0% { width: 0; } 18.787% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-httpx2 { 0% { opacity: 0; } 18.787% { opacity: 1; } 100% { opacity: 1; } }
    #bar-httpx { animation: fill-httpx 8s linear infinite; }
    #badge-httpx { animation: show-httpx 8s step-end infinite; }
    @keyframes fill-httpx { 0% { width: 0; } 62.500% { width: 520px; } 100% { width: 520px; } }
    @keyframes show-httpx { 0% { opacity: 0; } 62.500% { opacity: 1; } 100% { opacity: 1; } }

    @keyframes playhead {
      0% { transform: translateX(0); }
      62.500% { transform: translateX(520px); }
      100% { transform: translateX(520px); }
    }
  </style>

  <rect width="760" height="406" fill="#fcfcfb" />
  <text x="20" y="26" class="title">HTTP client throughput race</text>

  <g>
    <line x1="150" y1="46" x2="670" y2="46" class="grid" />
    <line x1="150.0" y1="46" x2="150.0" y2="346" class="grid" />
    <line x1="254.0" y1="46" x2="254.0" y2="346" class="grid" />
    <line x1="358.0" y1="46" x2="358.0" y2="346" class="grid" />
    <line x1="462.0" y1="46" x2="462.0" y2="346" class="grid" />
    <line x1="566.0" y1="46" x2="566.0" y2="346" class="grid" />
    <line x1="670.0" y1="46" x2="670.0" y2="346" class="grid" />
    <text x="150.0" y="40" class="tick" text-anchor="middle">0s</text>
    <text x="254.0" y="40" class="tick" text-anchor="middle">1s</text>
    <text x="358.0" y="40" class="tick" text-anchor="middle">2s</text>
    <text x="462.0" y="40" class="tick" text-anchor="middle">3s</text>
    <text x="566.0" y="40" class="tick" text-anchor="middle">4s</text>
    <text x="670.0" y="40" class="tick" text-anchor="middle">5s</text>
    <g id="playhead">
      <line x1="150" y1="46" x2="150" y2="346" class="playhead" />
    </g>
  </g>

  <g>
    <rect x="150" y="58" width="520" height="26" rx="4" class="track" />
    <rect id="bar-pyreqwest" x="150" y="58" height="26" rx="4" width="0" fill="#4a3aa7" />
    <rect x="20" y="71.0" width="10" height="10" rx="2" fill="#4a3aa7" />
    <text x="36" y="73.0" class="name">pyreqwest</text>
    <text x="36" y="86.0" class="rate">54,972 req/s</text>
    <g id="badge-pyreqwest" opacity="0">
      <text x="680" y="80.0" class="badge" fill="#4a3aa7">
        &#x2713; 0.10s
      </text>
    </g>
  </g>
  <g>
    <rect x="150" y="100" width="520" height="26" rx="4" class="track" />
    <rect id="bar-lothc" x="150" y="100" height="26" rx="4" width="0" fill="#008300" />
    <rect x="20" y="113.0" width="10" height="10" rx="2" fill="#008300" />
    <text x="36" y="115.0" class="name">lothc</text>
    <text x="36" y="128.0" class="rate">53,180 req/s</text>
    <g id="badge-lothc" opacity="0">
      <text x="680" y="122.0" class="badge" fill="#008300">
        &#x2713; 0.10s
      </text>
    </g>
  </g>
  <g>
    <rect x="150" y="142" width="520" height="26" rx="4" class="track" />
    <rect id="bar-aiohttp" x="150" y="142" height="26" rx="4" width="0" fill="#e87ba4" />
    <rect x="20" y="155.0" width="10" height="10" rx="2" fill="#e87ba4" />
    <text x="36" y="157.0" class="name">aiohttp</text>
    <text x="36" y="170.0" class="rate">25,884 req/s</text>
    <g id="badge-aiohttp" opacity="0">
      <text x="680" y="164.0" class="badge" fill="#e87ba4">
        &#x2713; 0.21s
      </text>
    </g>
  </g>
  <g>
    <rect x="150" y="184" width="520" height="26" rx="4" class="track" />
    <rect id="bar-aiosonic" x="150" y="184" height="26" rx="4" width="0" fill="#eda100" />
    <rect x="20" y="197.0" width="10" height="10" rx="2" fill="#eda100" />
    <text x="36" y="199.0" class="name">aiosonic</text>
    <text x="36" y="212.0" class="rate">17,782 req/s</text>
    <g id="badge-aiosonic" opacity="0">
      <text x="680" y="206.0" class="badge" fill="#eda100">
        &#x2713; 0.30s
      </text>
    </g>
  </g>
  <g>
    <rect x="150" y="226" width="520" height="26" rx="4" class="track" />
    <rect id="bar-niquests" x="150" y="226" height="26" rx="4" width="0" fill="#eb6834" />
    <rect x="20" y="239.0" width="10" height="10" rx="2" fill="#eb6834" />
    <text x="36" y="241.0" class="name">niquests</text>
    <text x="36" y="254.0" class="rate">3,696 req/s</text>
    <g id="badge-niquests" opacity="0">
      <text x="680" y="248.0" class="badge" fill="#eb6834">
        &#x2713; 1.44s
      </text>
    </g>
  </g>
  <g>
    <rect x="150" y="268" width="520" height="26" rx="4" class="track" />
    <rect id="bar-httpx2" x="150" y="268" height="26" rx="4" width="0" fill="#1baf7a" />
    <rect x="20" y="281.0" width="10" height="10" rx="2" fill="#1baf7a" />
    <text x="36" y="283.0" class="name">httpx2</text>
    <text x="36" y="296.0" class="rate">3,542 req/s</text>
    <g id="badge-httpx2" opacity="0">
      <text x="680" y="290.0" class="badge" fill="#1baf7a">
        &#x2713; 1.50s
      </text>
    </g>
  </g>
  <g>
    <rect x="150" y="310" width="520" height="26" rx="4" class="track" />
    <rect id="bar-httpx" x="150" y="310" height="26" rx="4" width="0" fill="#2a78d6" />
    <rect x="20" y="323.0" width="10" height="10" rx="2" fill="#2a78d6" />
    <text x="36" y="325.0" class="name">httpx</text>
    <text x="36" y="338.0" class="rate">1,065 req/s</text>
    <g id="badge-httpx" opacity="0">
      <text x="680" y="332.0" class="badge" fill="#2a78d6">
        &#x2713; 5.00s
      </text>
    </g>
  </g>

  <text x="20" y="394" class="rate">Benchmarked with perf.py — 10000 requests, concurrency 100, against a tiny JSON server.</text>
</svg>
