[project]
name = "lothc"
# SemVer (e.g. `1.0.0`, no "v" prefix), derived from the git tag via hatch-vcs (see
# [tool.hatch.version] below) — SemVer, not CalVer, because this is a library other packages
# depend on: the major/minor/patch split is the signal pip's resolver, Dependabot, etc. rely on to
# know whether an upgrade is safe, which a date can't communicate. No tag has been pushed yet, so
# this currently resolves to a `0.1.dev0+gHASH`-style fallback version — push the first real tag
# before publishing.
dynamic = ["version"]
description = "Lord Of The Http Clients — a typed HTTP client built on pyreqwest, with first-class pydantic and msgspec support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyreqwest>=0.12.2"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.12.5"]
msgspec = ["msgspec>=0.19.0"]
typeguard = ["typeguard>=4.4.0"]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "aiosonic>=1.0.5",
    "asv>=0.6.4",
    "basedpyright>=1.38.0",
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "msgspec>=0.19.0",
    "niquests>=3.21.0",
    "prek>=0.4.14",
    "pydantic>=2.12.5",
    "pylint>=4.0.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "rich>=15.0.0",
    "ruff>=0.15.14",
    "typeguard>=4.4.0",
    "vulture>=2.16",
    "yeetr[uvloop]>=2026.8.14.post1",
]
docs = ["zensical>=0.0.56"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# setuptools_scm's default tag regex accepts a bare `\d+\.\d+.\d+` tag as-is (e.g. `1.0.0`, no "v"
# prefix), so no tag_pattern override is needed — but verify once the first real tag is pushed.

[tool.hatch.build.targets.wheel]
packages = ["lothc"]

#=====================================================================================
# Tool configurations
#=====================================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.deptry]
# examples/ and perf.py are dev-only utility/benchmark scripts, not part of the installable
# package — they're expected to import dev-group dependencies directly. .asv/ holds asv's own
# per-commit checkouts + venvs (a full copy of this repo, gitignored) — not our code at all.
exclude = ["examples", "perf\\.py", "\\.venv", "\\.asv", "tests"]

[tool.deptry.per_rule_ignores]
# pydantic/msgspec/typeguard are all real, used-conditionally-at-runtime imports in
# lothc/_compat.py — deptry's static scan doesn't detect usage inside that try/except pattern for
# any of the three (confirmed empirically: msgspec only looked "used" before excluding
# examples/perf.py above, because those *also* happened to import it directly).
DEP002 = ["pydantic", "msgspec", "typeguard"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["lothc"]

[tool.ruff]
target-version = "py313"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",   # builtins shadowing
    "ANN", # type annotations
    "ARG", # unused arguments
    "B",   # bugbear (common bugs & bad patterns)
    "BLE", # blind excepts
    "C4",  # comprehensions
    "COM", # commas
    "DTZ", # datetime timezone
    "E",   # pycodestyle errors
    "ERA", # eradicate commented-out code
    "FA",  # future annotations
    "FBT", # boolean trap
    "F",   # pyflakes
    "I",   # import sorting
    "ICN", # import conventions
    "ISC", # implicit str concat
    "N",   # naming conventions
    "PGH", # pygrep-hooks
    "PTH", # pathlib
    "PT",  # pytest style
    "RET", # return statements
    "RUF", # Ruff extra rules
    "TRY", # tryceratops
    "S",   # security
    "SIM", # simplifications
    "C90", # mccabe complexity
    "TID", # tidy imports
    "TC",  # typing under TYPE_CHECKING
    "TD",  # TODOs must be annotated
    "UP",  # pyupgrade / newer syntax
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
    "T10", # debugger statements
]
ignore = [
    "COM812",
    "TC006",
    "TRY003", # every raise here is a short, self-contained message; a bespoke exception class per
    # ValueError/TypeError would be ceremony, not clarity — see style-guide.md
]

[tool.ruff.lint.isort]
known-first-party = ["lothc"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN001", # missing type annotations
    "S101",   # use of assert detected
    "S106",   # hardcoded-password false positives on deliberate literal test values
    "S603",   # subprocess call with a fixed, non-attacker-controlled argument list
    "S607",   # partial executable path — deliberately PATH-resolved, matching Taskfile invocations
]
"examples/*" = [
    "T201",
    "ANN",
    "S101", # server.py asserts a dynamically-loaded importlib spec/loader is present
] # print() and looser annotations are fine in examples
"perf.py" = [
    "S101",
] # sanity-check asserts that the benchmark actually decoded a real body
"asv_bench/*" = [
    "S101", # bench_verbs.py asserts a dynamically-loaded importlib spec/loader is present,
] # same pattern as examples/server.py

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
preview = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["lothc", "tests", "examples"]
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = "none"

[tool.pylint.main]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring", # this project deliberately writes no comments/docstrings
    # unless the WHY is non-obvious — see style-guide.md
    "invalid-name", # flags this project's own deliberate PEP 695 TypeVar names (TData, THeaders,
    # TId, TLine, ...) against pylint's older single-uppercase-letter default
    "too-many-arguments",
    "too-many-positional-arguments", # every verb's overload set genuinely needs this many —
    # see the overload-pairs pattern in CLAUDE.md
    "too-few-public-methods", # the _compat.py fallback stub classes (Struct, Decoder, BaseModel,
    # TypeAdapter) are deliberately empty placeholders, never meant to have real methods
]

[tool.pylint.design]
max-locals = 20 # one real case (the streaming line-buffering generator) legitimately needs a
# couple more than pylint's default 15 — matches this project's own mccabe complexity ceiling
# ([tool.ruff.lint.mccabe] max-complexity = 15) in spirit, just a different metric

[tool.pylint.format]
max-module-lines = 2000 # _client.py is one deliberately unsplit file (see CLAUDE.md: "split it
# once it earns a split") that's grown past pylint's default 1000-line threshold this session;
# bumped rather than split, since no split has actually been decided on
