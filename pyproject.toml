[project]
name = "lothc"
# SemVer (e.g. `1.0.0`, no "v" prefix), derived from the git tag via hatch-vcs (see
# [tool.hatch.version] below) — SemVer, not CalVer, because this is a library other packages
# depend on: the major/minor/patch split is the signal pip's resolver, Dependabot, etc. rely on to
# know whether an upgrade is safe, which a date can't communicate. No tag has been pushed yet, so
# this currently resolves to a `0.1.dev0+gHASH`-style fallback version — push the first real tag
# before publishing.
dynamic = ["version"]
description = "Lord Of The Http Clients — a typed HTTP client built on pyreqwest, with first-class pydantic and msgspec support"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyreqwest>=0.12.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/RogerThomas/lothc"
Repository = "https://github.com/RogerThomas/lothc"
Documentation = "https://rogerthomas.github.io/lothc/"
Issues = "https://github.com/RogerThomas/lothc/issues"

[project.optional-dependencies]
pydantic = ["pydantic>=2.12.5"]
msgspec = ["msgspec>=0.19.0"]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "aiosonic>=1.0.5",
    "asv>=0.6.4",
    "basedpyright>=1.38.0",
    "deptry>=0.25.1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "msgspec>=0.19.0",
    "mypy>=2.3.1",
    "niquests>=3.21.0",
    "prek>=0.4.14",
    "pydantic>=2.12.5",
    "pylint>=4.0.7",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "ruff>=0.15.14",
    "ty>=0.0.74",
    "types-requests>=2.33.0.20260712",
    "vulture>=2.16",
    "yeetr[uvloop]>=2026.8.14.post1",
    "zuban>=0.9.1",
]
docs = ["zensical>=0.0.56"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# setuptools_scm's default tag regex accepts a bare `\d+\.\d+.\d+` tag as-is (e.g. `1.0.0`, no "v"
# prefix), so no tag_pattern override is needed — but verify once the first real tag is pushed.

[tool.hatch.build.targets.wheel]
packages = ["lothc"]

[tool.hatch.build.targets.sdist]
# hatchling's sdist default is "everything under version control" — verified live that this
# shipped the ENTIRE repo to PyPI in the 0.0.1 release (perf.py, benchmarks/, asv_bench/, tests/,
# docs/, CLAUDE.md, AGENTS.md, .github/workflows/, uv.lock, ...), none of which an installer needs
# to build or run the package. An explicit allowlist here, mirroring the wheel's own scoping, is
# the fix — checked the rebuilt sdist's real file list afterward, not just the config.
include = ["/lothc", "/README.md", "/LICENSE"]

#=====================================================================================
# Tool configurations
#=====================================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.deptry]
# examples/, perf.py, and asv_bench/ are dev-only utility/benchmark scripts, not part of the
# installable package — they're expected to import dev-group dependencies directly. .asv/ holds
# asv's own per-commit checkouts + venvs (a full copy of this repo, gitignored) — not our code.
exclude = ["examples", "perf\\.py", "asv_bench", "\\.venv", "\\.asv", "tests"]

[tool.deptry.per_rule_ignores]
# pydantic/msgspec are both real, used-conditionally-at-runtime imports in lothc/_compat.py —
# deptry's static scan doesn't detect usage inside that try/except pattern for either of them
# (confirmed empirically: msgspec only looked "used" before excluding examples/perf.py above,
# because those *also* happened to import it directly).
DEP002 = ["pydantic", "msgspec"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["lothc"]

[tool.ruff]
target-version = "py313"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",   # builtins shadowing
    "ANN", # type annotations
    "ARG", # unused arguments
    "B",   # bugbear (common bugs & bad patterns)
    "BLE", # blind excepts
    "C4",  # comprehensions
    "COM", # commas
    "DTZ", # datetime timezone
    "E",   # pycodestyle errors
    "ERA", # eradicate commented-out code
    "FA",  # future annotations
    "FBT", # boolean trap
    "F",   # pyflakes
    "I",   # import sorting
    "ICN", # import conventions
    "ISC", # implicit str concat
    "N",   # naming conventions
    "PGH", # pygrep-hooks
    "PTH", # pathlib
    "PT",  # pytest style
    "RET", # return statements
    "RUF", # Ruff extra rules
    "TRY", # tryceratops
    "S",   # security
    "SIM", # simplifications
    "C90", # mccabe complexity
    "TID", # tidy imports
    "TC",  # typing under TYPE_CHECKING
    "TD",  # TODOs must be annotated
    "UP",  # pyupgrade / newer syntax
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
    "T10", # debugger statements
]
ignore = [
    "COM812",
    "TC006",
    "TRY003", # every raise here is a short, self-contained message; a bespoke exception class per
    # ValueError/TypeError would be ceremony, not clarity — see style-guide.md
]

[tool.ruff.lint.isort]
known-first-party = ["lothc"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN001", # missing type annotations
    "S101",   # use of assert detected
    "S105",   # hardcoded-password false positives on deliberate literal test values, e.g.
    # test_oauth.py asserting a cache file holds `"access_token": "token-1"`
    "S106",   # hardcoded-password false positives on deliberate literal test values
    "S603",   # subprocess call with a fixed, non-attacker-controlled argument list
    "S607",   # partial executable path — deliberately PATH-resolved, matching Taskfile invocations
]
"examples/*" = [
    "T201",
    "ANN",
    "S101", # server.py asserts a dynamically-loaded importlib spec/loader is present
] # print() and looser annotations are fine in examples
"perf.py" = [
    "S101",
] # sanity-check asserts that the benchmark actually decoded a real body
"asv_bench/*" = [
    "S101", # bench_verbs.py asserts a dynamically-loaded importlib spec/loader is present,
] # same pattern as examples/server.py

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
preview = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["lothc", "tests", "examples"]
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = "none"

[tool.pylint.main]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring", # this project deliberately writes no comments/docstrings
    # unless the WHY is non-obvious — see style-guide.md
    "invalid-name", # flags this project's own deliberate PEP 695 TypeVar names (TData, THeaders,
    # TId, TLine, ...) against pylint's older single-uppercase-letter default
    "too-many-arguments",
    "too-many-positional-arguments", # every verb's overload set genuinely needs this many —
    # see the overload-pairs pattern in CLAUDE.md
    "too-few-public-methods", # the _compat.py fallback stub classes (Struct, Decoder, BaseModel,
    # TypeAdapter) are deliberately empty placeholders, never meant to have real methods
]

[tool.pylint.design]
max-attributes = 13 # `OAuthProvider`/`SyncOAuthProvider` (lothc/_oauth.py) store every one of
# their 11 keyword-only constructor options as a private attribute plus the cached token and the
# lock — 13, over pylint's default 7. Grouping the options into a config DTO would just move the
# same 11 names one attribute access further away from the code that reads them, for no gain
max-locals = 28 # one real case (the streaming line-buffering generator) legitimately needs a
# couple more than pylint's default 15 — matches this project's own mccabe complexity ceiling
# ([tool.ruff.lint.mccabe] max-complexity = 15) in spirit, just a different metric. Bumped again,
# 20 -> 21, after `_sse_stream`/its sync mirror gained a 21st local (the new `error_type` param,
# threaded through for typed error bodies), then 21 -> 27 after `build`/its sync mirror gained
# the TLS/connection-pool config params (`connect_timeout`, `root_certificates`, `identity_pem`,
# `min_tls_version`, `max_tls_version`, `danger_accept_invalid_certs`, `https_only`,
# `max_connections`, `pool_idle_timeout`, `pool_max_idle_per_host`, `pool_timeout`), then
# 27 -> 28 after `build`/its sync mirror gained `read_timeout` (the idle-gap stall detector for
# `sse()`)
max-branches = 15 # `_apply_form_value`/`_apply_sync_form_value`'s dispatch `match` statements
# (Form/File redesign: str/int/bytes/three File-tuple shapes/bare Path/BufferedIOBase/list/dict-
# or-model/tuple-repeat) need 13, one over pylint's default 12 — bumped to 15 to match this
# project's own mccabe complexity ceiling ([tool.ruff.lint.mccabe] max-complexity = 15) rather
# than pick an arbitrary number just past the current count

[tool.pylint.format]
max-module-lines = 5500 # _client.py is one deliberately unsplit file (see CLAUDE.md: "split it
# once it earns a split") that's grown past its previous bump (3800) to 4038 lines after
# threading a per-verb `skip_auth` override through every overload of every verb on both clients
# (mirroring the earlier `timeout` override); bumped again rather than split, since no split has
# actually been decided on. 5000 -> 5500 after `sse()` gained spec-compliant reconnect
# (`max_reconnects`/`reconnect_delay`/`reconnect_on_close` on all 26 overload sites, plus the
# shared reconnect/parsing helpers), landing at ~5200
