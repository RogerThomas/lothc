<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" width="320" height="410">
  <defs>
    <radialGradient id="band" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="35%" stop-color="#e8b84b"/>
      <stop offset="70%" stop-color="#a86a1e"/>
      <stop offset="100%" stop-color="#6e4212"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="50%" stop-color="#c98f2e"/>
      <stop offset="100%" stop-color="#5c3a10"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

