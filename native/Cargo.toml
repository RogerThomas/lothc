[package]
name = "lothc-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

# Same pins as pyreqwest 0.15.0 where it has them.
[dependencies]
pyo3 = { version = "=0.29.3", features = ["extension-module"] }

# The transport, POSIX only: on Windows the module is `src/unsupported.rs`, which needs only pyo3.
[target.'cfg(unix)'.dependencies]
hyper = { version = "=1.12.0", features = ["client", "http1"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
futures-executor = "=0.3.34"
futures-util = "=0.3.34"
libc = "0.2"
form_urlencoded = "1"
ryu = "1"
itoa = "1"
# TLS as reqwest 0.13's `rustls` feature: aws-lc-rs + the OS trust store.
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
rustls-pki-types = "=1.15.1"
# URL joining and serialization exactly as reqwest's (`Url::join`, `query_pairs_mut`).
url = "=2.5.8"
percent-encoding = "=2.3.2"
# `json=` dicts/lists serialized the way pyreqwest's `body_json` does: pythonize's `depythonize`
# into a `serde_json::Value` (sorted keys), then serde_json's own number formatting.
pythonize = "=0.29.0"
serde_json = "=1.0.152"
# Basic auth from a URL's userinfo, encoded as reqwest does.
base64 = "=0.23.1"
# Response decompression with the codecs reqwest's gzip/deflate/brotli/zstd features use (through
# tower-http and async-compression); their own dependencies are pinned in Cargo.lock to pyreqwest's.
compression-codecs = { version = "=0.4.45", default-features = false, features = ["gzip", "zlib", "brotli", "zstd"] }
compression-core = "=0.4.33"
# Which proxy a request takes, as reqwest picks it: hyper-util's `Matcher` (the proxy environment
# variables, NO_PROXY's rules, a proxy URL's credentials). `client-proxy` alone pulls in no tokio.
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-proxy"] }
# A CONNECT response, parsed as hyper-util's tunnel parses it.
httparse = "=1.10.1"
# `form=` part types as reqwest's multipart sets them: `mime` parses one (pyreqwest's `MimeType`),
# `mime_guess` guesses a file's from its extension (`Part::file`), without the reverse mappings,
# as reqwest depends on it.
mime = "=0.3.17"
mime_guess = { version = "=2.0.5", default-features = false }
# `cookie_store=True`'s jar as reqwest's `cookies` feature keeps it (`cookie::Jar`): the `cookie`
# crate parses each `Set-Cookie`, and `cookie_store` decides what's kept and sent, with the
# features pyreqwest's own dependency on it adds (`preserve_order`: a `Cookie` header lists a
# request's cookies in the order the jar stored them).
cookie = "=0.18.2"
cookie_store = { version = "=0.22.1", features = ["preserve_order"] }
# Sockets set up as hyper-util's `HttpConnector` sets them up (keepalive, a local address bind),
# with its features (`all` has the keepalive retry count).
socket2 = { version = "=0.6.5", features = ["all"] }

[build-dependencies]
# `build.rs`: the macOS link args for a plain `cargo build`. Same version as pyo3.
pyo3-build-config = "=0.29.3"

[profile.release]
lto = "fat"
codegen-units = 1
